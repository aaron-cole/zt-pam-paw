# Feel free to modify to reflect the operators/images you're targeting for your install
# To get an accurate representation of the current list of operators and their current default channels,
#   run the following command on an internet-facing box that has the oc-mirror binary available (NOTE: it takes a few minutes to complete)
#   oc-mirror list operators --catalog=registry.redhat.io/redhat/redhat-operator-index:v4.19 --version=4.19 # Replace "4.19" with whatever minor release version you're targeting for the install
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    # Uncommenting the following two lines and updating to reflect your specific architecture, will help decrease the size of the mirrored content.
    # architectures:
    #   - amd64
    channels:
      - type: ocp
        name: stable-4.19
        minVersion: 4.19.3
        maxVersion: 4.19.3
    graph: true
  additionalImages:
    - name: registry.redhat.io/rhel9/support-tools:latest
    - name: registry.redhat.io/rhel9/rhel-guest-image:latest
    - name: registry.redhat.io/openshift4/ose-must-gather:latest
    - name: registry.redhat.io/ubi9/ubi:latest
    - name: registry.redhat.io/odf4/odf-must-gather-rhel9:v4.19
    - name: registry.redhat.io/container-native-virtualization/cnv-must-gather-rhel9:v4.19
  operators:    
    # Red Hat Operator Index Catalog
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.19
      packages:
        # Advanced Cluster Security for Kubernetes
        - name: rhacs-operator
          channels:
            - name: stable
        # Quay
        - name: quay-operator
          channels:
            - name: stable-3.16
        - name: quay-bridge-operator
          channels:
            - name: stable-3.16
        - name: container-security-operator
          channels:
            - name: stable-3.16
        # Local Storage Operator
        - name: lvms-operator
          channels:
            - name: stable-4.19
        - name: local-storage-operator
          channels:
            - name: stable
        # Web Terminal
        - name: web-terminal
          channels:
            - name: fast
        - name: devworkspace-operator
          channels:
            - name: fast
        # Virtualization
        - name: kubernetes-nmstate-operator
          channels:
            - name: stable
        # Update Service
        - name: cincinnati-operator
          channels:
            - name: v1
        # Compliance Operator
        - name: compliance-operator
          channels:
            - name: stable
        # File Integrity Operator
        - name: file-integrity-operator
          channels:
            - name: stable
        # MetalLB Operator
        - name: metallb-operator
          channels:
            - name: stable
        # PTP Operator
        - name: ptp-operator
          channels:
            - name: stable
        # OpenShift Logging
        - name: cluster-logging
          channels:
            - name: stable-6.5
        - name: loki-operator
          channels:
            - name: stable-6.5
        # OpenShift Service Mesh
        - name: servicemeshoperator3
          channels:
            - name: stable
        - name: kiali-ossm
          channels:
            - name: stable
        - name: jaeger-product
          channels:
            - name: stable
        # Cluster Observability Operator
        - name: cluster-observability-operator
          channels:
            - name: stable
        # Network Observability Operator
        - name: netobserv-operator
          channels:
            - name: stable
        # Keycloak Operator
        - name: rhbk-operator
          channels:
            - name: stable-v26.4
        # Cert Manager
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1
        - name: devspaces
          channels:
            - name: stable
        - name: rhdh-operator
          channels:
            - name: stable

    # Red Hat Community Operator Index Catalog
    - catalog: registry.redhat.io/redhat/community-operator-index:v4.19
      packages:
        # Trident
        - name: group-sync-operator
          channels:
            - name: alpha
